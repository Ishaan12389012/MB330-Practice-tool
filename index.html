<title>MB-330 Field Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred working column under a sticky tab bar; content blocks are plain sections, only interactive objects (questions, cards) get a frame. */
:root {
  /* Charcoal & cream with dusty blue (single dark look, chosen by Raj) */
  --bg: #1a1917; --surface: #23221f; --sunk: #141311; --line: #38352f;
  --ink: #f1e9d8; --muted: #a9a192; --accent: #8fb3d9; --accent-ink: #0f1c2a; --accent-soft: #24323f;
  --amber: #5a4a2e; --amber-soft: #efe6d3; --trap-ink: #2a251d;
  --good: #8fcf9c; --good-soft: #1f3326; --bad: #ef8f7f; --bad-soft: #3d201b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 1.2rem; }
.brand span { color: var(--muted); font-size: .85rem; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 8px 12px 10px; border-bottom: 3px solid transparent; font-weight: 600; font-size: .95rem; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a .n { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: var(--amber-soft); color: var(--amber); font-size: .75rem; text-align: center; font-variant-numeric: tabular-nums; }

main { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 28px; }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mono { font-family: var(--f-mono); font-size: .85rem; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; cursor: pointer; font-size: .875rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.tag.warn { background: var(--amber-soft); color: var(--amber); }

/* Home */
.today { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding-block: 8px; }
.today .big { font-family: var(--f-display); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
@media (max-width: 560px) { .today { grid-template-columns: 1fr; } }
.loop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.loop > div { padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.loop > div + div { border-left: 1px solid var(--line); }
.loop .k { font-family: var(--f-mono); font-size: .78rem; color: var(--accent); }
@media (max-width: 640px) { .loop { grid-template-columns: 1fr; } .loop > div + div { border-left: 0; border-top: 1px solid var(--line); } }

.domains { display: grid; gap: 0; border-top: 1px solid var(--line); }
.dom { display: grid; grid-template-columns: minmax(0, 1fr) 160px auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.dom .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.barlab { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
@media (max-width: 640px) { .dom { grid-template-columns: 1fr; gap: 8px; } }

/* Cards */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.clist { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary h3 { flex: 1; min-width: 0; }
.card[open] > summary { border-bottom: 1px solid var(--line); }
.cbody { padding: 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 3px; }
.field .eyebrow { color: var(--accent); }
.where { font-family: var(--f-mono); font-size: .82rem; background: var(--sunk); padding: 8px 10px; border-radius: 6px; overflow-wrap: anywhere; }
.trap { background: var(--amber-soft); color: var(--trap-ink); padding: 10px 12px; border-radius: 6px; }
.trap .eyebrow { color: var(--amber); }
.dots { display: inline-flex; gap: 3px; flex: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* Quiz */
.qbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.qtext { font-size: 1.12rem; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.opt .mk { width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; font-family: var(--f-mono); }
.opt.multi .mk { border-radius: 5px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .mk { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .why { display: block; margin-top: 4px; font-size: .9rem; color: var(--muted); }
.opt.right .why, .opt.wrong .why { color: var(--ink); }
.opt[disabled] { cursor: default; }
.verdict { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: .92rem; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.pbar { height: 4px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }

/* Labs */
.steps { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.steps input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.steps li.done span { color: var(--muted); text-decoration: line-through; }
textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }

/* Exam results */
.score { font-family: var(--f-display); font-size: 3.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface); font-size: .9rem; color: var(--muted); }

/* Overlay */
.ov { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov .card { max-width: 680px; width: 100%; max-height: 88vh; overflow: auto; }
.ovhead { display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
footer { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; color: var(--muted); font-size: .82rem; }

/* Learn: topic list + one-card reader */
.learn { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; align-items: start; }
.toc { display: grid; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); max-height: calc(100vh - 130px); overflow: auto; padding-right: 4px; }
.toc .search { margin-bottom: 8px; flex: none; }
.tochead { width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; padding: 10px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; }
.tochead .small { white-space: nowrap; }
.tochead:hover { background: var(--sunk); }
.tocd.open .tochead { color: var(--accent); }
.toc ul { list-style: none; margin: 0 0 8px; padding: 0 0 0 8px; border-left: 1px solid var(--line); margin-left: 10px; }
.toci { width: 100%; display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: center; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: .92rem; color: var(--muted); }
.toci:hover { color: var(--ink); background: var(--sunk); }
.toci[aria-current="true"] { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.toci i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--line); }
.toci i.seen { background: var(--accent); border-color: var(--accent); }
.reader { display: grid; gap: 16px; max-width: 64ch; min-width: 0; }
.rtitle { font-size: 2rem; }
.rwhy { color: var(--muted); font-size: 1.02rem; }
.rplain { font-size: 1.08rem; line-height: 1.7; }
.rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.rtabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.rtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.rtab { min-height: 72px; }
.rtab.is-trap p { background: var(--amber-soft); color: var(--trap-ink); padding: 12px 14px; border-radius: 6px; }
.rtab.is-trap b, .trap b { color: #1a1917; }
.rlinks { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.rnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.rnav .btn { font-weight: 500; font-size: .9rem; max-width: 100%; }
.backbtn { display: none; justify-self: start; }
@media (max-width: 760px) {
  .learn { grid-template-columns: 1fr; }
  .toc { position: static; max-height: none; }
  .learn .reader { display: none; }
  .learn.show-reader .toc { display: none; }
  .learn.show-reader .reader { display: grid; }
  .backbtn { display: inline-block; }
  .rtitle { font-size: 1.6rem; }
}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<header class="top"><div class="top-in">
  <div class="brand"><b>MB-330 Field Kit</b><span>Supply Chain Management Functional Consultant</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main id="main"></main>
<footer>Built for Raj and friends. Not affiliated with Microsoft. Skills outline: Microsoft Learn MB-330 study guide (Oct 21, 2026). Video links point to "MB-330 Exam Prep: Full Course" by Exam Pass Pro on YouTube, which is also unofficial.</footer>
<script>
// ---- Domains: from Microsoft's official MB-330 study guide, "Skills measured as of October 21, 2026" ----
const DOMAINS = [
  { id: "pim", name: "Product information management", short: "Products", weight: "25–30%", w: 27.5,
    skills: ["Create and manage products", "Configure prerequisites for products", "Configure additional product details", "Manage inventory pricing and costing"] },
  { id: "inv", name: "Inventory and asset management", short: "Inventory & assets", weight: "20–25%", w: 22.5,
    skills: ["Manage and process inventory activities", "Manage quality", "Configure asset management", "Implement asset management"] },
  { id: "scp", name: "Supply chain processes", short: "Buy & sell", weight: "15–20%", w: 17.5,
    skills: ["Implement procurement and sourcing", "Implement landed cost", "Implement common sales and marketing features"] },
  { id: "wms", name: "Warehouse and transportation management", short: "Warehouse & transport", weight: "20–25%", w: 22.5,
    skills: ["Configure warehouse management", "Perform warehouse management processes", "Implement transportation management", "Implement the Warehouse Management mobile app"] },
  { id: "mp", name: "Master planning", short: "Planning", weight: "10–15%", w: 12.5,
    skills: ["Configure master planning", "Manage master plans"] }
];

// ---- Concept cards ----
// plain: what it is in plain words. why: why a consultant cares. ex: Example.
// where: where to find it in D365 (use the search bar if the menu differs in your version).
// trap: what the exam likes to test. v: [seconds, label] chapter in the YouTube course (unofficial).
// low: true = Claude is less sure; check Microsoft Learn before relying on it.
const CARDS = [
// ===== PRODUCTS =====
{ id: "pim-products", d: "pim", t: "Products, product masters and variants",
  plain: "A <b>product</b> is a single item with no variants. A <b>product master</b> is a template that has product dimensions (Color, Size, Style, Configuration, Version). Each combination is a <b>variant</b>. You first create a <b>shared product</b> (for all legal entities), then <b>release</b> it to a legal entity, where it gets company settings and becomes a <b>released product</b>.",
  why: "Deciding product vs product master is a day-one choice. It drives stock, prices and planning per variant.",
  ex: "A bike company's City Bike is a product master with Color (Red, Blue) and Size (S, M, L), so up to 6 variants. A bike bell is a plain product.",
  where: "Product information management > Products > All products and product masters, then Released products",
  trap: "Shared = global definition. Released = per legal entity. A product that isn't released to a company can't be used on orders there. For a product master, create or generate the variants, then release them.",
  v: [247, "Creating Products and Variants"] },
{ id: "pim-dimgroups", d: "pim", t: "Dimension groups: product, storage, tracking",
  plain: "<b>Product</b> dimension group: which variant dimensions exist (Color, Size, Style, Configuration, Version). <b>Storage</b> dimension group: where stock is tracked (Site, Warehouse, Location, Inventory status, License plate). <b>Tracking</b> dimension group: how stock is traced (Batch number, Serial number, Owner).",
  why: "They decide what users must enter on every transaction, and they're hard to change once transactions exist.",
  ex: "Frames are serial-tracked, paint is batch-tracked, and the main warehouse runs advanced warehousing so Location, Inventory status and License plate are active.",
  where: "Product information management > Setup > Dimension and variant groups",
  trap: "The storage dimension group setting <b>Use warehouse management processes</b> is what makes an item WMS-enabled. Owner is a tracking dimension used for consignment. Only product dimensions create variants.",
  v: [540, "Product Dimensions and Groups"] },
{ id: "pim-imgroup", d: "pim", t: "Item model groups",
  plain: "A bundle of inventory rules for an item: the <b>inventory model</b> (costing method: FIFO, LIFO, LIFO date, Weighted average, Weighted average date, Standard cost, Moving average), whether it's a <b>stocked product</b>, whether <b>physical/financial negative inventory</b> is allowed, <b>quarantine management</b>, registration and picking requirements, and reservation settings.",
  why: "It controls how cost is calculated and how strict stock rules are. Wrong setup means wrong margins.",
  ex: "The company uses Standard cost for frames it makes, and FIFO for spare parts sold in the shop. A delivery fee is a non-stocked item.",
  where: "Inventory management > Setup > Inventory > Item model groups",
  trap: "Untick <b>Stocked product</b> for services. Clear <b>Physical negative inventory</b> to stop stock going below zero. Quarantine management here creates quarantine orders automatically.",
  v: [3045, "Inventory Valuation Methods"] },
{ id: "pim-reshier", d: "pim", t: "Reservation hierarchies",
  plain: "For WMS items, an ordered list of dimensions. Dimensions <b>above Location</b> are chosen when the order line is reserved. Dimensions <b>below Location</b> are chosen by the warehouse when work is created.",
  why: "It decides whether sales can reserve a specific batch or serial, or whether the warehouse picks it.",
  ex: "A customer wants all paint from one batch, so Batch sits above Location and sales can reserve that batch.",
  where: "Warehouse management > Setup > Inventory > Reservation hierarchy",
  trap: "Batch above location = batch-specific reservation on the order. Batch below location = warehouse decides (for example by FEFO). WMS items need a reservation hierarchy." },
{ id: "pim-unitseq", d: "pim", t: "Unit sequence groups and unit conversions",
  plain: "A <b>unit sequence group</b> lists units from smallest to largest (ea, box, pallet) for WMS items. <b>Unit conversions</b> say how many of one unit fit in another. They can be specific to one product.",
  why: "Warehouse receiving, put-away and picking in boxes or pallets depend on both.",
  ex: "Inner tubes: 1 box = 20 ea, 1 pallet = 40 boxes. Sequence: ea, box, pallet.",
  where: "Warehouse management > Setup > Warehouse > Unit sequence groups. Released product > Manage inventory > Unit conversions",
  trap: "Sequence group = order of units. Conversion = the factor between them. Intra-class = same kind of unit (ea to box). Inter-class = different kinds (kg to ea).",
  v: [1403, "Unit Sequences"] },
{ id: "pim-templates", d: "pim", t: "Product templates",
  plain: "Save the settings of a product you've set up as a <b>template</b> (just for you, or shared with everyone). When someone creates a new product they pick the template and most fields are filled in.",
  why: "Faster, more consistent product creation, and fewer missing settings.",
  ex: "The company saves 'Standard frame' with its item model group, item group and dimension groups.",
  where: "On the released product page, use the record template options on the Options tab. When you press New, you can choose a template.",
  trap: "Templates copy setup values. They don't link the products, so later changes to the template don't update existing products.",
  low: true },
{ id: "pim-bom", d: "pim", t: "BOMs and BOM versions",
  plain: "A <b>BOM</b> (bill of materials) lists the components and quantities needed to make an item. A <b>BOM version</b> links a BOM to an item, with a site, dates and a from-quantity. It must be <b>approved</b>, and <b>activated</b> to be the default.",
  why: "Production, costing and planning all use the active BOM version.",
  ex: "City Bike BOM: 1 frame, 2 wheels, 1 seat, 1 chain. Version 2 swaps the seat from 1 Jan.",
  where: "Released product > Engineer > BOM versions. Product information management > Bills of materials and formulas > Bills of materials",
  trap: "Approve is not activate. Line types: <b>Item</b> (normal), <b>Phantom</b> (sub-assembly exploded into the parent), <b>Pegged supply</b> (creates a linked sub-order), <b>Vendor</b> (subcontracted).",
  v: [892, "Bills of Materials Setup"] },
{ id: "pim-category", d: "pim", t: "Category hierarchies",
  plain: "A tree of categories for grouping products. You give a hierarchy a <b>role</b> (for example procurement, commodity code, or sales reporting) so the right module uses it.",
  why: "Procurement rules, reporting and attributes hang off categories.",
  ex: "For example: Bikes > City, Mountain. Parts > Frames, Wheels.",
  where: "Product information management > Setup > Categories and attributes > Category hierarchies, then Category hierarchy role associations",
  trap: "A hierarchy does nothing for a module until it's associated with that role." },
{ id: "pim-lifecycle", d: "pim", t: "Product lifecycle states",
  plain: "A state (for example Active, Phase out, Obsolete) on a released product or variant. Each state can allow, warn or block chosen business processes, and has an <b>Is active for planning</b> setting.",
  why: "Stop buying a discontinued model while still selling what's left, across many items at once.",
  ex: "The company sets the 2025 City Bike to Phase out: purchase orders blocked, sales allowed, not active for planning.",
  where: "Product information management > Setup > Product lifecycle state",
  trap: "If <b>Is active for planning</b> is off, master planning ignores the item.",
  v: [1713, "Product Lifecycle States"] },
{ id: "pim-attributes", d: "pim", t: "Product attributes",
  plain: "Extra descriptive fields on a product. An <b>attribute type</b> sets the data type and allowed values (text, integer, decimal, true/false, date). An <b>attribute</b> uses a type.",
  why: "Lets you describe and filter products without creating extra stock-keeping variants.",
  ex: "An attribute 'Frame material' uses a text type with values Aluminium, Carbon, Steel.",
  where: "Product information management > Setup > Categories and attributes > Attribute types, then Attributes",
  trap: "Attributes describe. Product dimensions create separate stock. If you don't need stock per value, use an attribute." },
{ id: "pim-barcodes", d: "pim", t: "Bar codes and GTIN codes",
  plain: "<b>Bar code setup</b> defines barcode types and formats (for example EAN-13, Code 128). You assign bar codes to an item, variant and unit. <b>GTIN</b> (Global Trade Item Number) codes are stored per item, variant and unit too.",
  why: "Scanners in the warehouse app read these, so each pack size needs the right code.",
  ex: "Inner tubes have one barcode on each tube (ea) and a different one on the box of 20.",
  where: "Inventory management > Setup > Bar codes. On the released product, open Bar codes or GTIN codes from the action pane (use the search bar if needed).",
  trap: "Barcodes and GTINs can differ per unit of measure." },
{ id: "pim-defaultorder", d: "pim", t: "Default order settings",
  plain: "Per item defaults for purchase, inventory and sales: default site and warehouse, minimum, maximum, multiple and standard quantity, lead time, and a <b>Stopped</b> flag. <b>Site-specific order settings</b> override them per site.",
  why: "Orders and planned orders follow these, so wrong values cause wrong order quantities.",
  ex: "The company buys tyres in multiples of 50 with a minimum of 100.",
  where: "Released product > Plan > Default order settings, and Site specific order settings",
  trap: "<b>Stopped</b> blocks that order type for the item. Master planning respects minimum and multiple." },
{ id: "pim-filtercodes", d: "pim", t: "Product filter codes",
  plain: "Codes on WMS items (for example FRAGILE, HEAVY) that warehouse rules can use to steer handling.",
  why: "You can write a location directive or template query that treats tagged items differently.",
  ex: "The company tags carbon frames FRAGILE so a location directive puts them only in ground-level locations.",
  where: "Set the codes up in Warehouse management setup, then assign them on the released product's Warehouse FastTab (search 'filter' if the page name differs).",
  trap: "Filter codes are used in queries for location directives, work templates and wave templates. They are not personal list filters.",
  low: true },
{ id: "pim-costing", d: "pim", t: "Costing versions and standard cost",
  plain: "A <b>costing version</b> holds item prices. Type <b>Standard cost</b>: you enter or calculate pending prices, then <b>activate</b> them, and they become the item's standard cost. Type <b>Planned cost</b>: for what-if simulations. Cost groups split cost into parts like material and labour.",
  why: "A standard cost item can't be transacted until it has an active cost price for the site.",
  ex: "The company calculates 2027 frame costs in version STD-2027 and activates them on 1 January.",
  where: "Cost management > Inventory accounting > Costing versions. Released product > Manage costs > Item price",
  trap: "The item model group must use Standard cost. Planned cost versions are for simulation, so their prices aren't activated as the standard cost. The cost price is per site.",
  v: [1129, "Cost Groups Configuration"] },
{ id: "pim-trade", d: "pim", t: "Trade agreements and price groups",
  plain: "<b>Trade agreements</b> store prices and discounts for sales and purchasing: <b>price</b>, <b>line discount</b>, <b>multiline discount</b>, <b>total discount</b>. You enter them in a trade agreement journal and <b>post</b> it. They can target one customer, a <b>price/discount group</b>, or all. The <b>Activate price/discount</b> page decides which combinations the system searches. Base prices on the released product are used when no agreement applies.",
  why: "Every sales and purchase price depends on this setup.",
  ex: "The company puts dealers in group DEALERS and gives them a 10% line discount on bikes. Retail customers pay the base price.",
  where: "Sales and marketing > Prices and discounts > Trade agreement journals (Procurement and sourcing has the same for vendors)",
  trap: "Not posted = not used. The relation (for example item group + customer group) must be activated. Line = one line. Multiline = several lines in the same multiline discount group. Total = whole order.",
  v: [4599, "Trade Agreements Procurement"] },

// ===== INVENTORY & ASSETS =====
{ id: "inv-journals", d: "inv", t: "Inventory journals",
  plain: "<b>Movement</b>: stock in or out, you choose the offset ledger account. <b>Inventory adjustment</b>: stock in or out, offset comes from the item's posting profile. <b>Transfer</b>: move between dimensions (warehouse, location, batch) in one step. <b>BOM</b>: report a BOM item as finished and use its components, without a production order. <b>Item arrival</b>: register received goods. <b>Counting</b>: count stock and post the difference.",
  why: "Picking the right journal gets the stock and the accounting right.",
  ex: "The company writes off 3 damaged helmets to a 'Marketing samples' expense account with a movement journal.",
  where: "Inventory management > Journal entries > Items (Movement, Inventory adjustment, Transfer, Bills of materials), Item arrival, Item counting",
  trap: "Movement vs adjustment: the question is who decides the offset account. Movement = you. Adjustment = posting profile.",
  v: [2232, "Inventory Journals Movement"] },
{ id: "inv-transfer", d: "inv", t: "Transfer orders",
  plain: "Move stock between warehouses in steps: create the order, <b>ship</b> it (stock goes to a <b>transit warehouse</b>), then <b>receive</b> it.",
  why: "You can see stock that's on the road, and it supports picking and shipping documents.",
  ex: "The company sends 30 bikes from the main warehouse to its city shop. While on the truck they sit in transit.",
  where: "Inventory management > Outbound orders > Transfer order",
  trap: "Transfer order = ship and receive with transit. Transfer journal = one step, no transit. Warehouses used for transfer orders need a transit warehouse (a warehouse of type Transit) assigned." },
{ id: "inv-close", d: "inv", t: "Inventory close and recalculation",
  plain: "<b>Inventory close</b> settles issues against receipts using the item's costing method, posts cost adjustments, and locks the period: nothing can be posted on or before the closing date. <b>Recalculation</b> adjusts costs but doesn't settle or lock. You can <b>cancel</b> a close, newest first.",
  why: "Without close, FIFO or weighted average issue costs aren't final.",
  ex: "The company closes inventory at 31 October before closing the ledger period. Mid-month it runs recalculation to see costs early.",
  where: "Inventory management > Periodic tasks > Closing and adjustment",
  trap: "Recalc does not lock. Moving average items don't need close to settle costs." },
{ id: "inv-blocking", d: "inv", t: "Inventory blocking and batch disposition codes",
  plain: "<b>Inventory blocking</b> puts stock on hold so it can't be used. You create manual blockings yourself and remove them by deleting the line. Quality orders can block stock automatically. A <b>batch disposition code</b> on a batch can block that batch from processes like sales or picking.",
  why: "Hold damaged or suspect stock without moving it.",
  ex: "The company blocks 5 bikes with scratched paint. An expired paint batch gets a disposition code that blocks picking.",
  where: "Inventory management > Periodic tasks > Inventory blocking. Batch disposition codes are under Inventory management setup (search 'batch disposition').",
  trap: "Manual blocking is removed by deleting it. Blocking created by a quality order is released by the quality order." },
{ id: "inv-abc", d: "inv", t: "ABC classification and inventory reports",
  plain: "<b>ABC classification</b> sorts items into classes A, B and C by value, contribution margin, revenue or carrying cost, using percentage thresholds you choose. The class is saved on the item.",
  why: "Focus counting and control on the few items that matter most.",
  ex: "For example: frames are class A (count monthly), bolts are class C (count yearly).",
  where: "Inventory management > Periodic tasks > ABC classification",
  trap: "You pick the model (value, margin, revenue, carrying cost) when you run it." },
{ id: "inv-quality", d: "inv", t: "Quality associations and quality orders",
  plain: "Building blocks: <b>tests</b> (what you measure), <b>test groups</b> (a set of tests plus sampling), <b>item sampling</b>. A <b>quality association</b> links items (and vendor, customer or all) to a test group for an event, like purchase product receipt or production report as finished. When the event happens, a <b>quality order</b> is created. You enter results and <b>validate</b>: pass or fail. It can block stock until it passes.",
  why: "Automatic, consistent inspection instead of relying on people to remember.",
  ex: "The company checks 10% of every frame receipt from vendor Steelworks for weld strength.",
  where: "Inventory management > Setup > Quality control. Quality orders: Inventory management > Periodic tasks > Quality management > Quality orders",
  trap: "Turn on <b>Use quality management</b> in Inventory and warehouse management parameters first. The association is what triggers automatic quality orders." },
{ id: "inv-nonconf", d: "inv", t: "Nonconformances",
  plain: "A record of a quality problem: item, quantity, <b>problem type</b>. Types: Customer, Vendor, Internal, Production, Service request. After <b>approval</b> you add corrections and diagnostics, and you can create a quality order from it.",
  why: "Tracks complaints and fixes so the same problem doesn't repeat.",
  ex: "A customer reports a bent wheel. The company logs a Customer nonconformance and a correction: inspect the wheel batch.",
  where: "Inventory management > Periodic tasks > Quality management > Nonconformances",
  trap: "Approve before corrections. Problem types decide which nonconformance types they can be used with." },
{ id: "inv-quarantine", d: "inv", t: "Quarantine orders",
  plain: "Move stock to a <b>quarantine warehouse</b> to inspect it. Created by hand, or automatically on receipt if the item model group has quarantine management. Steps: <b>Start</b> (moves to quarantine), <b>Report as finished</b>, <b>End</b> (moves back). You can also scrap.",
  why: "Physically separates suspect stock and keeps it out of sales.",
  ex: "The company quarantines a delivery of brake pads until a lab checks them.",
  where: "Inventory management > Periodic tasks > Quality management > Quarantine orders",
  trap: "For WMS-enabled items, use inventory status (and quality orders) instead of quarantine orders." },
{ id: "am-assets", d: "inv", t: "Assets, asset types and functional locations",
  plain: "An <b>asset</b> is equipment you maintain. An <b>asset type</b> groups assets with shared settings like counters. A <b>functional location</b> is where an asset is installed, in a hierarchy (plant > line > station). Assets can move between functional locations.",
  why: "Maintenance history, costs and plans hang off this structure.",
  ex: "The company's 'Paint robot 1' is asset type Robot, installed at PLANT1-PAINT-01.",
  where: "Asset management > Assets > All assets. Asset management > Functional locations > All functional locations. Asset types are in Asset management setup.",
  trap: "Functional location = the place. Asset = the thing. The functional location type controls things like whether more than one asset can be installed." },
{ id: "am-lifecycle", d: "inv", t: "Lifecycle states and models (assets and work orders)",
  plain: "<b>Lifecycle states</b> (for example Created, Active, Under repair, Scrapped) grouped into a <b>lifecycle model</b> that you attach to asset types. Work orders have their own lifecycle states (for example Created, Scheduled, In progress, Finished) that control what can be done at each step.",
  why: "They control what's allowed in each stage and give you status reporting.",
  ex: "The company's paint robot moves from Active to Under repair while its work order runs.",
  where: "Asset management > Setup (lifecycle states and lifecycle models for assets and functional locations; work order lifecycle states under Work orders)",
  trap: "A state's settings decide what's allowed, for example whether a work order can be scheduled or updated in that state." },
{ id: "am-workorders", d: "inv", t: "Work orders: types, scheduling, consumption",
  plain: "A <b>work order</b> is a maintenance job on one or more assets. The <b>work order type</b> (for example Corrective, Preventive) sets defaults. Jobs are <b>scheduled</b> to workers based on capacity and calendars. <b>Consumption</b> (hours, items, expenses) is registered with journals. Work order settings live in Asset management parameters.",
  why: "This is where maintenance work and cost are planned and captured.",
  ex: "A technician spends 3 hours and uses 2 nozzles on the robot. Both are registered on the work order.",
  where: "Asset management > Work orders > All work orders. Parameters: Asset management > Setup > Asset management parameters",
  trap: "Scheduling uses worker capacity. Consumption is posted through journals (hours, items, expenses)." },
{ id: "am-maint", d: "inv", t: "Preventive vs reactive maintenance",
  plain: "<b>Reactive</b>: something breaks, a <b>maintenance request</b> is created, approved and turned into a work order. <b>Preventive</b>: <b>maintenance plans</b> are time-based (every 3 months) or counter-based (every 500 hours). The <b>maintenance schedule</b> lists due plan lines and you create work orders from it. <b>Maintenance rounds</b> = same job across many assets.",
  why: "Exam scenarios often ask which tool fits a described situation.",
  ex: "Paint robot nozzle cleaning every 200 operating hours (counter). An operator reporting a leak creates a maintenance request.",
  where: "Asset management > Setup > Preventive maintenance > Maintenance plans. Asset management > Preventive maintenance > Maintenance schedule. Asset management > Maintenance requests",
  trap: "Counter-based plans need counter readings registered on the asset." },
{ id: "am-loans", d: "inv", t: "Asset loans (check this one yourself)",
  plain: "The official outline lists 'Manage and configure asset loans'. I couldn't confirm the exact setup from memory, so I've left the details out rather than guess.",
  why: "It's in the skills outline, so expect it to come up.",
  ex: "Lab idea: in your environment, open Asset management and search for 'loan'. Note which page holds it, what fields it has, and how an asset is returned.",
  where: "Asset management (search 'loan')",
  trap: "Read the Microsoft Learn page on asset loans before the exam.",
  low: true },

// ===== BUY & SELL =====
{ id: "scp-vendors", d: "scp", t: "Vendors",
  plain: "The vendor record holds the vendor group (drives posting), payment and delivery terms, currency, tax group and a <b>Hold</b> status (for example No, Invoice, All, Payment, Requisition, Never). You can also keep an <b>approved vendor list</b> per product.",
  why: "Every purchase starts from the vendor's setup.",
  ex: "The company puts vendor Steelworks on hold 'Invoice' during a pricing dispute: POs still allowed, invoices blocked.",
  where: "Procurement and sourcing > Vendors > All vendors (also under Accounts payable)",
  trap: "Hold = All blocks every transaction. Approved vendor list check can be 'warning only' or 'not allowed'." },
{ id: "scp-req", d: "scp", t: "Purchase requisitions, RFQs and purchase orders",
  plain: "<b>Requisition</b>: an internal request, approved by workflow, then released to a PO. <b>RFQ</b> (request for quotation): send to several vendors, enter their replies, compare, accept one, which creates a PO or agreement. <b>Purchase order</b>: confirm, receive (product receipt), invoice.",
  why: "This is the core procure-to-pay flow.",
  ex: "A engineer requests 10 torque wrenches. After approval, the requisition becomes a PO to the tool vendor.",
  where: "Procurement and sourcing > Purchase requisitions / Requests for quotation / Purchase orders",
  trap: "Requisitions need an active workflow. With change management on, POs need approval before confirmation.",
  v: [3565, "Purchase Requisitions Setup"] },
{ id: "scp-agree", d: "scp", t: "Purchase agreements and vendor rebates",
  plain: "A <b>purchase agreement</b> is a commitment to buy a quantity or value from a vendor over a period at agreed prices. POs that reference it are <b>release orders</b> and use up the commitment. <b>Vendor rebates</b> are set up as deals in Rebate management.",
  why: "Locks in prices and tracks whether you hit your commitments.",
  ex: "The company agrees to buy 10,000 tyres in 2027 at a fixed price from TyreCo. Each monthly PO is a release order.",
  where: "Procurement and sourcing > Purchase agreements. Rebate management > Rebate management deals",
  trap: "The agreement must be <b>Effective</b> before release orders can use it." },
{ id: "scp-consign", d: "scp", t: "Consignment inventory",
  plain: "The vendor owns stock in your warehouse until you use it. It uses the <b>Owner</b> tracking dimension. A <b>consignment replenishment order</b> brings stock in with no value. When you use it, the <b>inventory ownership change journal</b> moves ownership to you and creates a PO line.",
  why: "Common in real projects and a favourite exam topic.",
  ex: "BoltCo keeps bolts in the company's warehouse. The company only pays for what it takes.",
  where: "Procurement and sourcing > Consignment",
  trap: "No Owner dimension = no consignment. Ownership change journal = the moment you buy it." },
{ id: "scp-overunder", d: "scp", t: "Over/under delivery and delivery schedules",
  plain: "<b>Over/under delivery</b> percentages say how much more or less than ordered can be received without an error. You allow it in procurement parameters and set the percentage on the item. A <b>delivery schedule</b> splits one order line into several dates and quantities.",
  why: "Real deliveries rarely match exactly.",
  ex: "The company allows 5% overdelivery on tyres. One line of 1,200 tyres is split into 3 monthly deliveries.",
  where: "Released product (Purchase and Sell FastTabs). Order line > Delivery schedule",
  trap: "Both the parameter and the percentage must be set." },
{ id: "scp-catpol", d: "scp", t: "Procurement categories, charges and purchasing policies",
  plain: "<b>Procurement categories</b> group what you buy, with linked vendors. <b>Charge codes</b> are extra costs (freight, insurance) on order headers or lines. <b>Auto charges</b> add them automatically. <b>Purchasing policies</b> are rules per organization: which categories people can request, catalogs, requisition rules.",
  why: "Controls who can buy what, and makes sure extra costs are captured.",
  ex: "The company's office staff can only request from 'Office supplies'. Freight is added to every PO from Asia by an auto charge.",
  where: "Procurement and sourcing > Procurement categories. Procurement and sourcing > Setup > Policies > Purchasing policies. Charges codes are under Procurement and sourcing setup.",
  trap: "Purchasing policies apply to organizations (legal entities or operating units), not to individual items." },
{ id: "scp-collab", d: "scp", t: "Vendor collaboration",
  plain: "A portal where external vendors see POs sent to them, accept or reject them, or propose changes. They can also see consignment stock. Each vendor has a <b>Collaboration activation</b> setting.",
  why: "Less email back and forth on order confirmations.",
  ex: "TyreCo accepts the company's POs in the portal.",
  where: "Vendor record > General > Collaboration activation. Vendor collaboration users are set up per vendor contact.",
  trap: "<b>Active (PO is auto-confirmed)</b>: vendor accepts, PO is confirmed. <b>Active (PO isn't auto-confirmed)</b>: someone at your company still confirms it.",
  v: [4370, "Vendor Collaboration Setup"] },
{ id: "scp-receive", d: "scp", t: "Registration, product receipt and vendor returns",
  plain: "<b>Registration</b> records that goods arrived (arrival journal, PO line, or the warehouse app). <b>Product receipt</b> posts the receipt: physical stock update and a product receipt document. <b>Vendor return</b>: an order line with negative quantity, often with the vendor's return number.",
  why: "Exam questions test the order of these steps.",
  ex: "The company's dock registers 100 tyres in the morning and posts the product receipt after checking them.",
  where: "Purchase order > Receive > Product receipt",
  trap: "Registered is not received. Product receipt is the posting step." },
{ id: "scp-wf", d: "scp", t: "Procurement workflows",
  plain: "Configurable approvals: purchase requisition review, purchase order approval (when change management is on), and more.",
  why: "Almost every client wants approvals by amount or category.",
  ex: "For example: requisitions over $5,000 need the plant manager's approval.",
  where: "Procurement and sourcing > Setup > Procurement and sourcing workflows",
  trap: "No active requisition workflow = requisitions can't be submitted. Change management is switched on in procurement parameters." },
{ id: "lc-voyage", d: "scp", t: "Landed cost: voyages and costs",
  plain: "Tracks import shipments and their extra costs (freight, duty, insurance) and adds them to item cost. A <b>voyage</b> holds <b>shipping containers</b> and <b>folios</b> (groups of PO or transfer order lines). <b>Journey templates</b> define the legs. <b>Cost type codes</b> are the kinds of cost. <b>Auto costs</b> add costs automatically. The <b>tracking control center</b> follows voyage and container statuses. You can estimate costs, then compare with actuals within <b>over/under tolerances</b>.",
  why: "Gives true item cost for imported goods.",
  ex: "The company imports frames from Taiwan: one voyage, two containers, freight and 4% duty added automatically.",
  where: "Landed cost > Voyages > All voyages. Landed cost > Setup (parameters, cost type codes, journey templates, auto costs)",
  trap: "Costs are spread across lines by a method like quantity, amount, weight or volume. Voyage statuses are configured in setup." },
{ id: "sales-flow", d: "scp", t: "Customers, quotations, sales orders, reservations and returns",
  plain: "<b>Customer</b> record: group, terms, credit limit. <b>Quotation</b>: confirm it to create a sales order. <b>Sales order</b>: confirm, pick, pack (packing slip), invoice. <b>Reservation</b>: Manual, Automatic, or Explosion. <b>Return order</b> (RMA): return reason codes and <b>disposition codes</b> decide what happens: Credit, Credit only, Scrap, Replace and credit, Replace and scrap, Return to customer.",
  why: "This is the core order-to-cash flow.",
  ex: "A shop returns a damaged bike. It's received and scrapped, and the shop gets a credit (disposition: Scrap).",
  where: "Sales and marketing > Sales quotations / Sales orders / Sales return",
  trap: "Credit only = credit without the item coming back. Scrap = item is received, then scrapped, and credited.",
  v: [5092, "Sales Orders Creation"] },
{ id: "sales-agree", d: "scp", t: "Sales agreements, sales groups and commissions",
  plain: "A <b>sales agreement</b> is a customer's commitment to buy a quantity or value at agreed prices. <b>Sales groups</b> list sales reps and their shares. <b>Commission calculation</b> sets who earns what, based on revenue or contribution margin. Commission posts when the invoice posts.",
  why: "Common setup at go-live.",
  ex: "Sales reps Ana and Ben split a 5% commission 60/40 on dealer orders.",
  where: "Sales and marketing > Sales agreements. Commission setup is under Sales and marketing > Setup > Commissions",
  trap: "No invoice = no commission posted." },
{ id: "sales-ic", d: "scp", t: "Intercompany orders",
  plain: "Trade between legal entities in the same D365. The vendor in company A is linked to a customer in company B with an <b>intercompany trading relationship</b>. A PO in A then creates a sales order in B automatically. <b>Direct delivery</b> ships from B straight to A's customer.",
  why: "Groups with several companies use it all the time.",
  ex: "A US sales company buys bikes from its sister factory company. The US PO creates the factory's sales order.",
  where: "Customer or vendor > Setup > Intercompany",
  trap: "Both companies must be in the same environment and the trading relationship must be active.",
  v: [10832, "Intercompany Planning Setup"] },
{ id: "sales-rebate", d: "scp", t: "Customer rebates and product bundles",
  plain: "<b>Rebates</b> are set up as deals in Rebate management (for example 2% back above 1,000 bikes a year): accrue, process, post. A <b>product bundle</b> is sold as one item made of components defined in a BOM. When the order is confirmed, the bundle line is broken into component lines.",
  why: "Both are in the official outline.",
  ex: "The company sells a 'Commuter kit' bundle: helmet, lock and lights.",
  where: "Rebate management > Rebate management deals. Bundles: search 'bundle' in Sales and marketing or Product information management parameters.",
  trap: "Check the bundle details on Microsoft Learn. This part is from general knowledge.",
  low: true },
{ id: "sales-atp", d: "scp", t: "Delivery date control: ATP and CTP",
  plain: "<b>Delivery date control</b> on a sales line can be None, Sales lead time, <b>ATP</b> (available-to-promise: uses on-hand plus planned receipts and issues within the ATP time fence), ATP + Issue margin, or <b>CTP</b> (capable-to-promise: uses master planning to work out when you can make or buy it, including capacity).",
  why: "Giving customers realistic delivery dates is a key consulting topic.",
  ex: "A dealer orders 50 bikes. ATP says 12 March from planned receipts. CTP says 20 March once factory capacity is included.",
  where: "Sales order line > Delivery date control. Defaults on the released product and in sales parameters",
  trap: "ATP doesn't look at production capacity. CTP does, using the dynamic plan.",
  v: [5567, "Order Promising ATP"] },

// ===== WAREHOUSE & TRANSPORT =====
{ id: "wms-structure", d: "wms", t: "Sites, warehouses, locations, profiles and zones",
  plain: "Site > warehouse > location. A <b>location format</b> is the naming pattern (aisle-rack-shelf-bin). A <b>location profile</b> sets behaviour: license plate tracking, mixed items or batches allowed, location type. <b>Location types</b> mark special places like staging or final shipping. <b>Zones</b> group locations (for example Bulk, Picking) for use in rules.",
  why: "Every warehouse rule refers to these.",
  ex: "Warehouse 24: zones BULK and PICK. Locations like A-01-03-B.",
  where: "Warehouse management > Setup > Warehouse (Locations, Location formats, Location profiles, Location types, Zones)",
  trap: "A warehouse must have <b>Use warehouse management processes</b> ticked for advanced WMS.",
  v: [1958, "Warehouses Zones and Locations"] },
{ id: "wms-directives", d: "wms", t: "Location directives",
  plain: "Rules that say where to <b>pick</b> from or <b>put</b> to, per work order type (purchase, sales, transfer, replenishment, production). Built as header, <b>lines</b> (quantity and unit ranges) and <b>actions</b> (a location query plus a strategy like Consolidate or Empty location with no incoming work). Checked in <b>sequence</b>: the first that finds a location wins.",
  why: "One of the most tested warehouse topics.",
  ex: "For example: full pallets of tyres go to BULK, partial quantities go to the PICK zone.",
  where: "Warehouse management > Setup > Location directives",
  trap: "If the wrong location is used, check the sequence order first. Lines can be restricted by unit.",
  v: [6804, "Location Directives Setup"] },
{ id: "wms-templates", d: "wms", t: "Work, wave and load templates; work policies",
  plain: "<b>Work template</b>: which work lines (pick, put) are created for a work order type, when it applies (query), and <b>work header breaks</b> (for example max lines per work). <b>Wave template</b>: how shipping, production or kanban waves are processed (steps such as allocate, replenish, containerize, create work, release). <b>Load template</b>: equipment limits like max weight and volume. <b>Work policy</b>: stops work being created for chosen processes, locations or products.",
  why: "Controls how work is created for warehouse staff.",
  ex: "The company limits pick work to 10 lines and has a work policy so transfer receipts at the city shop don't create work.",
  where: "Warehouse management > Setup > Work (Work templates, Work policies), Waves > Wave templates, Load > Load templates",
  trap: "Templates are checked in sequence, like directives. A work policy stops work being created. It doesn't change how work is created.",
  v: [7078, "Work Templates Setup"] },
{ id: "wms-labels", d: "wms", t: "Labels, packing and containerization",
  plain: "Print <b>license plate</b>, <b>wave</b>, <b>product</b> and <b>GS1</b> labels using label layouts and <b>document routing</b>. <b>Physical dimensions</b> (weight, size per unit) feed <b>containerization</b>, which uses container types, container groups and container build templates. Packing can be done at a packing station.",
  why: "Labels and packing are needed to ship anything.",
  ex: "The company prints a license plate label for each pallet at receipt and packs online orders into standard boxes.",
  where: "Warehouse management > Setup > Document routing. Container setup is under Warehouse management > Setup > Containers",
  trap: "Containerization is a wave step that uses container build templates." },
{ id: "wms-inout", d: "wms", t: "Inbound and outbound flows; inventory status",
  plain: "<b>Inbound</b>: goods arrive, are registered in the mobile app (PO receiving, license plate receiving with an ASN), put-away work is created by location directives, and a worker puts them away. <b>Outbound</b>: release to warehouse, shipment and load, wave, pick work, put to staging, pack, ship confirm. <b>Inventory status</b> (for example Available, Damaged) can be marked as blocking.",
  why: "Exam scenarios walk through these steps.",
  ex: "A damaged box at receiving is registered with status Damaged, which is a blocking status.",
  where: "Warehouse management > Setup > Inventory > Inventory statuses. Release to warehouse from the sales order or the Release to warehouse page",
  trap: "A blocking inventory status means the stock can't be reserved. The default status is set in warehouse management parameters." },
{ id: "wms-replen", d: "wms", t: "Replenishment, cycle counting, cross docking",
  plain: "<b>Replenishment</b>: <b>min/max</b> keeps pick locations above a minimum, <b>wave demand</b> tops up when a wave lacks stock, <b>load demand</b> works by load. <b>Cycle counting</b>: plans or thresholds create counting work. Differences outside tolerance go to <b>Cycle count work pending review</b>. <b>Cross docking</b>: received goods go straight to outbound for waiting orders.",
  why: "Keeps pick faces full and stock accurate.",
  ex: "The company's helmet pick location is refilled from bulk when it drops below 10.",
  where: "Warehouse management > Setup > Replenishment. Cycle counting plans are under Warehouse management > Setup > Cycle counting",
  trap: "Wave demand replenishment runs as part of wave processing. Min/max runs on a schedule.",
  v: [2793, "Cycle Counting Processes"] },
{ id: "wms-loadplan", d: "wms", t: "Load planning workbenches",
  plain: "Inbound and outbound <b>load planning workbenches</b> build loads from open order lines, check them against load templates, rate them, and release them to the warehouse.",
  why: "Where transport and warehouse planning meet.",
  ex: "The company groups three dealer orders into one truck load and releases it.",
  where: "Transportation management > Planning > Load planning workbench (and Inbound load planning workbench)",
  trap: "You can release a load to the warehouse straight from the workbench.",
  v: [8376, "Load Building Setup"] },
{ id: "wms-mobile", d: "wms", t: "Warehouse Management mobile app",
  plain: "Install the app from the app store and connect it with Microsoft Entra ID. Set up <b>workers</b> (user ID, default warehouse, menu). <b>Menu items</b> are Indirect (inquiries, like license plate inquiry) or Work (create or carry out work, like PO receiving or sales picking). <b>Menus</b> group menu items. <b>Detours</b> let a worker jump to another menu item from a step and come back with data filled in.",
  why: "Every warehouse process runs through the app.",
  ex: "A worker doing a pick detours to license plate inquiry, then returns to the pick.",
  where: "Warehouse management > Setup > Mobile device (Mobile device menu items, Mobile device menu, Mobile device steps). Workers: Warehouse management > Setup > Worker",
  trap: "Detours are set on the <b>Mobile device steps</b> page.",
  v: [6533, "Mobile Device Configuration"] },
{ id: "tms-rates", d: "wms", t: "Carriers, rating and routing",
  plain: "<b>Shipping carriers</b> have services and can be grouped in <b>carrier groups</b>. A <b>rate engine</b> does the calculation. A <b>rate master</b> holds the rate data. <b>Route plans</b> are routes with segments and hubs. <b>Route guides</b> are rules that pick a route plan. The <b>rating and routing workbench</b> compares carriers. <b>Dock appointment scheduling</b> books time slots at the dock.",
  why: "Picks the cheapest valid carrier and route.",
  ex: "The company rate shops between two carriers for a 400 kg shipment and books a 10:00 dock slot.",
  where: "Transportation management > Setup (Carriers, Rating, Routing, Engines)",
  trap: "Route guide chooses a route plan. Rate engine calculates. Rate master stores the rates.",
  v: [8121, "Rating and Routing Concepts"] },
{ id: "tms-freight", d: "wms", t: "Freight bills and reconciliation",
  plain: "When a load ships, <b>freight bill details</b> are created from the rates. The carrier's invoice is matched against them, by hand or <b>automatically</b>. An <b>audit master</b> sets tolerances for automatic matching. <b>Reconciliation reasons</b> explain differences. Freight bill types and their assignments set the matching fields.",
  why: "Stops overpaying carriers.",
  ex: "A carrier bills $412 for a $400 shipment. Inside the 5% tolerance, it auto-matches.",
  where: "Transportation management > Freight reconciliation (search 'freight bill' or 'audit master')",
  trap: "Audit master = tolerance for automatic reconciliation.",
  v: [8676, "Freight Reconciliation Configuration"] },

// ===== PLANNING =====
{ id: "mp-coverage", d: "mp", t: "Coverage groups, coverage codes and item coverage",
  plain: "A <b>coverage group</b> holds planning rules. The <b>coverage code</b> is the main one: <b>Period</b> (one planned order covers all demand in the coverage period), <b>Requirement</b> (one planned order per requirement), <b>Min./Max.</b> (when stock falls below min, refill to max), <b>Manual</b> (no planned orders), <b>Priority</b> (Planning Optimization only). <b>Item coverage</b> sets item-specific values like min and max per site or warehouse.",
  why: "Coverage settings decide every planned order.",
  ex: "For example: frames use Period, 7 days. Helmets use Min/Max, 50 to 200.",
  where: "Master planning > Setup > Coverage > Coverage groups. Released product > Plan > Item coverage",
  trap: "The coverage period in days only applies to the Period code. Manual = master planning creates nothing.",
  v: [9815, "Coverage Groups Setup"] },
{ id: "mp-posneg", d: "mp", t: "Positive days and negative days",
  plain: "<b>Positive days</b> are subtracted from a requirement's due date. An existing receipt earlier than that window can't be used for it, so a new planned order is created. <b>Negative days</b> are added to the due date. A receipt arriving later than the due date but inside that window can still be used: no new planned order, you get an action or futures message instead.",
  why: "One of the most confusing planning settings, and Microsoft tests it.",
  ex: "A sale is due 19 Sept and a PO arrives 20 Sept. Negative days 0: a new planned order is created. Negative days 3: the PO is used and a delay message appears.",
  where: "Coverage group (and item coverage)",
  trap: "Negative days 0 means planning always creates a new planned order for late supply. Microsoft suggests negative days above the item's lead time, plus dynamic negative days." },
{ id: "mp-fences", d: "mp", t: "Time fences, action messages and delays",
  plain: "<b>Time fences</b> are day windows. <b>Coverage</b>: how far ahead planning looks (Microsoft suggests longer than total lead time). <b>Freeze</b>: planned orders inside aren't changed. <b>Firming</b>: planned orders inside are firmed automatically. Others: BOM explosion, capacity, forecast plan, action message, calculated delays. <b>Action messages</b> suggest changes to existing orders: advance, postpone, increase, decrease. <b>Calculated delays</b> warn when supply can't meet the date.",
  why: "Controls how far ahead and how aggressively planning acts.",
  ex: "For example: coverage 100 days, firming 7 days, so next week's planned purchases are firmed automatically.",
  where: "Coverage group (Other tab), item coverage, and master plan (the master plan setting overrides)",
  trap: "A time fence on the master plan overrides the coverage group and item coverage.",
  low: true },
{ id: "mp-plans", d: "mp", t: "Master plans, Planning Optimization and planned orders",
  plain: "A <b>static plan</b> is the main plan you run and keep. A <b>dynamic plan</b> is used for CTP and quick updates. Both are named in <b>Master planning parameters</b>. <b>Planning Optimization</b> is the planning engine Microsoft supports going forward. After a run, review <b>planned orders</b> (purchase, transfer, production) and <b>firm</b> them to turn them into real orders. <b>Period templates</b> set time buckets (days, weeks, months) for pages like the <b>Supply schedule</b>, where you see supply and demand by period and can edit planned orders.",
  why: "This is the planner's daily routine.",
  ex: "The company runs the static plan nightly. Each morning the buyer firms planned purchase orders for tyres.",
  where: "Master planning > Setup > Master planning parameters. Master planning > Master planning > Run. Master planning > Common > Planned orders",
  trap: "Firming turns a planned order into a real order. Changing the static plan name in parameters changes which plan users see by default.",
  v: [10341, "Running Master Scheduling"] },
{ id: "mp-safety", d: "mp", t: "Safety margins and safety stock journal",
  plain: "<b>Safety margins</b> are extra days. <b>Receipt margin</b>: added after the receipt date before stock counts as available. <b>Issue margin</b>: subtracted from the requirement date, so goods are needed earlier. <b>Reorder margin</b>: added to purchase lead time. The <b>safety stock journal</b> proposes minimum stock from past usage. Post it to update item coverage minimums.",
  why: "Buffers against late vendors and slow receiving.",
  ex: "The company adds a 1-day receipt margin because inspecting frames takes a day.",
  where: "Master plan and coverage group setup. Safety stock journal: Master planning > Master planning > Run > Safety stock calculation",
  trap: "The safety stock journal changes item coverage minimums only when you post it.",
  low: true }
];

// ---------- PRACTICE ----------
function buildSession(domId, size, cardId) {
  let pool = QUESTIONS.filter((q) => (!domId || domId === "all" || q.d === domId) && (!cardId || q.c === cardId));
  const due = pool.filter((q) => isDue("q:" + q.id)).sort((a, b) => rec("q:" + a.id).due - rec("q:" + b.id).due);
  let fresh = pool.filter((q) => !rec("q:" + q.id));
  if (!domId || domId === "all") {
    // weight new questions by exam weight
    const byD = {}; fresh.forEach((q) => (byD[q.d] = byD[q.d] || []).push(q));
    Object.keys(byD).forEach((k) => (byD[k] = shuffle(byD[k])));
    const out = []; let guard = 0;
    while (Object.values(byD).some((a) => a.length) && guard++ < 1000) {
      const avail = DOMAINS.filter((d) => byD[d.id]?.length);
      let r = Math.random() * avail.reduce((s, d) => s + d.w, 0);
      const pick = avail.find((d) => (r -= d.w) <= 0) || avail[0];
      out.push(byD[pick.id].shift());
    }
    fresh = out;
  } else fresh = shuffle(fresh);
  let items = due.concat(fresh).slice(0, size);
  let extra = false;
  if (!items.length) { // nothing due or new: weakest first
    items = shuffle(pool).sort((a, b) => (rec("q:" + a.id)?.box || 0) - (rec("q:" + b.id)?.box || 0)).slice(0, size);
    extra = true;
  }
  return { items, i: 0, picked: [], guessed: false, checked: false, right: 0, requeued: new Set(), extra, order: null };
}

  session = buildSession(domId, cardId ? 8 : 10, cardId);

  go("practice"); render();
}

}

const EXAM_N = 40, EXAM_MIN = 100;
function startExam() {

  picks = shuffle(picks).slice(0, EXAM_N);
  exam = { items: picks.map((q) => ({ q, order: shuffle(q.o.map((_, i) => i)), picked: [] })), i: 0, start: Date.now(), done: false, flagged: new Set() };

function tick() {

}
function finishExam() {

  exam.result = { right, n: exam.items.length, by, mins: Math.round((Date.now() - exam.start) / 60000) };

}

document.addEventListener("click", (e) => {

  const a = t.dataset.act, v = t.dataset.v;
  if (["guess", "flag", "step", "note", "name"].includes(a)) return; // handled by change/input
  switch (a) {
    case "close-ov": t.closest(".ov").remove(); break;
    case "dom": ui.dom = v; render(); break;
    case "learn-dom": ui.ldom = v; ui.cardId = null; ui.mobileReader = false; flash = null; go("learn"); break;
    case "toc-dom": ui.ldom = v; ui.cardId = null; ui.search = ""; render(); break;

    case "start-mixed": startPractice("all"); break;

      const firstTime = !session.seenOnce.has(q.id); session.seenOnce.add(q.id);

      if (!ok && firstTime) { session.items.push(q); session.requeued.add(q.id); }

    case "xprev": exam.i--; render(); break;
    case "xnext": exam.i++; render(); break;

});

  const t = e.target, a = t.dataset?.act;
  if (a === "guess") session.guessed = t.checked;
  if (a === "flag") { t.checked ? exam.flagged.add(exam.i) : exam.flagged.delete(exam.i); render(); }
  if (a === "step") {
    const id = t.dataset.lab, st = S.labs[id] || []; st[+t.dataset.v] = t.checked; S.labs[id] = st; touchDay(); save();
    ui.open = id; t.closest("li").classList.toggle("done", t.checked);
    const l = LABS.find((x) => x.id === id), done = l.steps.filter((_, i) => st[i]).length;
    const tag = t.closest("details").querySelector("summary .tag"); tag.textContent = done === l.steps.length ? "Done" : `${done}/${l.steps.length}`;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target, a = t.dataset?.act;
  if (a === "note") { S.notes[t.dataset.k] = t.value; save(); }
  if (a === "name") { S.name = t.value.slice(0, 40); save(); }
  if (t.id === "search") { ui.search = t.value; const pos = t.selectionStart; render(); const s = $("#search"); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset?.lab && d.open) ui.open = d.dataset.lab; }, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelector(".ov")?.remove();
  if (view !== "practice" || !session || e.target.matches("input,textarea")) return;
  const k = e.key.toUpperCase();
  if ("ABCD".includes(k) && k.length === 1 && !session.checked) { const btn = document.querySelectorAll(".opt")[("ABCD").indexOf(k)]; btn?.click(); }
  if (e.key === "Enter") { const b = $(session.checked ? "[data-act=next]" : "[data-act=check]:not([disabled])"); b?.click(); }
});

render();
})();
</script></body></html>
